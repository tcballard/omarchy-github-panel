name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
          python3 -m pip install PyYAML==6.0.3 PySide6==6.11.2 graphql-core==3.2.12
      - name: Test GitHub operations with mocked transport
        run: python3 -B -m unittest discover -s tests -v
      - name: Build plugin archive
        run: python3 -B scripts/package.py
      - name: Exercise native keyboard and workspace flows
        run: bash tests/keyboard
      - name: Keep repository dropdown and image labels literal in Basic and Fusion
        run: python3 -B tests/plaintext_runner.py
